[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# -------------------------------------------------------------------
# 1. API FUNCTION ROUTING (MUST BE PLACED BEFORE SPA CATCH-ALL)
# -------------------------------------------------------------------

# Direct health check function (independent of DB/R2)
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# Route all API requests to the unified Netlify Function wrapper
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# -------------------------------------------------------------------
# 2. SPA CATCH-ALL REDIRECT (MUST BE LAST)
# -------------------------------------------------------------------
# Client-side routing fallback: only routes not matching /api/* or
# Netlify Functions will fall through to index.html with HTTP 200.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
